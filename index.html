<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하이라인닷넷 업무 자동화 도구</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e5e9;
    --text: #1f2328;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-bg: #eef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* 좌측 메뉴 */
  nav.sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: width .15s ease;
    /* overflow는 hidden으로 두지 않는다 — 접힌 메뉴 항목은 display:none으로 이미 감춰지고,
       overflow:hidden을 쓰면 사이드바 테두리에 절반 걸치게 배치한 접기 버튼(오른쪽으로
       -13px 튀어나옴)까지 같이 잘려버린다. */
    overflow: visible;
  }
  nav.sidebar h1 {
    font-size: 16px;
    font-weight: 700;
    padding: 0 20px 16px;
    margin: 0 0 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  nav.sidebar ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  nav.sidebar li.menu-item {
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    border-left: 3px solid transparent;
    white-space: nowrap;
  }
  nav.sidebar li.menu-item:hover {
    background: var(--accent-bg);
    color: var(--text);
  }
  nav.sidebar li.menu-item.active {
    background: var(--accent-bg);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  /* 메뉴 순서 바꾸기(끌어다 놓기) — 끄는 중인 항목은 흐리게, 놓일 자리는 선으로 표시한다.
     경계선은 border 대신 box-shadow(inset)로 그려서 항목 높이가 흔들리지 않게 한다. */
  nav.sidebar li.menu-item.dragging { opacity: .4; }
  nav.sidebar li.menu-item.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  nav.sidebar li.menu-item.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .menu-reset-btn {
    display: block;
    margin: 10px 20px 0;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .menu-reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  /* 사이드바를 접으면 글자가 사라지므로 버튼도 같이 숨긴다 */
  nav.sidebar.collapsed .menu-reset-btn { display: none; }

  /* 메뉴 접기/펼치기 토글 버튼 — 사이드바 오른쪽 위 모서리에 걸쳐서 항상 보이게 둔다 */
  .sidebar-toggle-btn {
    position: absolute;
    top: 16px;
    right: -13px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    z-index: 5;
  }
  .sidebar-toggle-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  nav.sidebar.collapsed {
    width: 48px;
  }
  nav.sidebar.collapsed .sidebar-title-text,
  nav.sidebar.collapsed ul#menu-list {
    display: none;
  }
  nav.sidebar.collapsed h1 {
    border-bottom: none;
  }

  /* 콘텐츠 영역 */
  main {
    flex: 1;
    padding: 32px 40px;
    max-width: 900px;
  }
  main.wide-content {
    max-width: none;
  }
  main h2 {
    margin-top: 0;
    font-size: 22px;
  }
  main p.desc {
    color: var(--text-dim);
    line-height: 1.6;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .card h3 {
    margin-top: 0;
    font-size: 15px;
  }
  code {
    background: #f0f1f3;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #fef3c7;
    color: #92400e;
    margin-left: 8px;
  }

  /* 드래그&드롭 업로드 영역 */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
    background: var(--panel);
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover,
  .dropzone.dragover {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .btn {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { opacity: .9; }
  .status-msg {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
  }

  /* 필요서류 */
  .rd-toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .rd-select-all {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    cursor: pointer;
  }
  .rd-summary {
    flex: 1 1 auto;
    font-size: 13px;
    color: var(--text-dim);
  }
  .rd-action-btn {
    padding: 7px 14px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .rd-action-btn:hover:not(:disabled) { opacity: .9; }
  .rd-action-btn:disabled { opacity: .4; cursor: default; }
  .rd-list { margin-top: 4px; }
  .rd-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .rd-item:last-child { border-bottom: none; }
  .rd-item:hover { background: var(--accent-bg); }
  /* 이름이 길어도 뒤쪽 버튼을 밀어내지 않도록 줄임표 처리 */
  .rd-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }
  .rd-meta {
    flex: 0 0 auto;
    color: var(--text-dim);
    font-size: 12px;
  }
  .rd-mini-btn {
    flex: 0 0 auto;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    font-size: 12px;
    cursor: pointer;
  }
  .rd-mini-btn:hover { border-color: var(--accent); color: var(--accent); }
  .rd-del-btn:hover { border-color: #dc2626; color: #dc2626; }
  .rd-store {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--text-dim);
  }

  /* PDF 편집기 — "나누기"/"합치기" 탭 */
  .pdf-tabs {
    display: flex;
    gap: 4px;
    margin: 20px 0 0;
  }
  .pdf-tab {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--panel);
    border-radius: 6px 6px 0 0;
    font-size: 13px;
    cursor: pointer;
  }
  .pdf-tab.active {
    background: #fff;
    font-weight: 600;
    color: var(--accent);
  }
  /* 탭 바로 아래 카드가 탭과 이어져 보이도록 위쪽 여백을 없앤다 */
  .pdf-pane > .card:first-child { margin-top: 0; border-top-left-radius: 0; }

  .pdf-info {
    margin-top: 16px;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--accent-bg);
    font-size: 13px;
    font-weight: 600;
  }
  .pdf-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .pdf-section h3 { margin: 0 0 6px; }
  .pdf-range-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .pdf-range-row label { font-size: 13px; color: var(--text-dim); }
  .pdf-range-input {
    flex: 1 1 200px;
    min-width: 160px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .pdf-mini-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    font-size: 12px;
    cursor: pointer;
  }
  .pdf-mini-btn:hover { border-color: var(--accent); color: var(--accent); }
  /* 쪽 번호 칩 — 페이지가 많아도 화면을 밀어내지 않게 최대 높이를 두고 스크롤시킨다 */
  .pdf-page-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
  }
  .pdf-page-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .pdf-page-chip:hover { border-color: var(--accent); }
  .pdf-page-chip input { margin: 0; cursor: pointer; }
  .pdf-selected {
    margin: 10px 0 0;
    font-size: 13px;
    color: var(--text-dim);
  }

  /* PDF 파일 변환 (여러 PDF/이미지 → 1개) */
  .pm-toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .pm-summary {
    flex: 1 1 auto;
    font-size: 13px;
    font-weight: 600;
  }
  .pm-mini-btn {
    padding: 5px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    font-size: 12px;
    cursor: pointer;
  }
  .pm-mini-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pm-mini-btn:disabled { opacity: .4; cursor: default; }
  .pm-del-btn:hover:not(:disabled) { border-color: #dc2626; color: #dc2626; }
  /* 파일이 많아도 화면을 밀어내지 않게 최대 높이를 두고 스크롤시킨다 */
  .pm-list {
    margin-top: 10px;
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .pm-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .pm-item:last-child { border-bottom: none; }
  .pm-item:hover { background: var(--accent-bg); }
  .pm-order {
    flex: 0 0 24px;
    text-align: right;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  /* 파일명이 길어도 뒤쪽 버튼을 밀어내지 않도록 줄임표 처리 */
  .pm-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pm-meta {
    flex: 0 0 auto;
    color: var(--text-dim);
    font-size: 12px;
  }
  .pm-options {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 14px;
    font-size: 13px;
  }
  .pm-options-label { color: var(--text-dim); }
  .pm-options label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }

  /* 세금계산서 합계표 비교 — 결과 표는 읽기 전용이라 .wf-table(table-layout:fixed + input 스타일)을
     쓰지 않고 내용에 맞춰 폭이 잡히는 자체 스타일을 쓴다 */
  .tsc-zones {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) {
    .tsc-zones { grid-template-columns: 1fr; }
  }
  .tsc-summary {
    margin-top: 16px;
    border-collapse: collapse;
    font-size: 13px;
  }
  .tsc-summary th, .tsc-summary td {
    border: 1px solid var(--border);
    padding: 6px 14px;
    text-align: right;
    white-space: nowrap;
  }
  .tsc-summary th { background: var(--panel); text-align: center; font-weight: 600; }
  .tsc-summary tr:first-child th { background: var(--accent-bg); }
  .tsc-table-wrap { margin-top: 12px; overflow-x: auto; }
  .tsc-table {
    border-collapse: collapse;
    font-size: 13px;
    width: 100%;
  }
  .tsc-table th, .tsc-table td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    white-space: nowrap;
  }
  .tsc-table th { background: var(--panel); font-weight: 600; }
  .tsc-table td.tsc-num { text-align: right; }
  .tsc-table tbody tr:hover { background: var(--accent-bg); }
  .tsc-mismatch { color: #dc2626; font-weight: 600; }
  .tsc-tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .tsc-tag-missing { background: #fee2e2; color: #b91c1c; }
  .tsc-tag-diff { background: #fef3c7; color: #92400e; }
  .tsc-tag-fix { background: #e0e7ff; color: #3730a3; }
  .tsc-warn {
    margin: 12px 0 0;
    padding: 8px 12px;
    border-radius: 6px;
    background: #fef3c7;
    color: #92400e;
    font-size: 13px;
  }
  .tsc-ok { margin: 12px 0 0; color: #16a34a; font-weight: 600; }

  /* 복지제도 관리 */
  .wf-tabs {
    display: flex;
    gap: 4px;
    margin: 20px 0 0;
  }
  .wf-tab {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: #fff;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-dim);
  }
  .wf-tab.active {
    background: var(--accent-bg);
    color: var(--accent);
    font-weight: 600;
  }
  #wf-hiworks-status:empty,
  #wf-status:empty {
    margin: 0;
    min-height: 0;
  }
  .wf-panel {
    border: 1px solid var(--border);
    border-radius: 0 8px 8px 8px;
    background: #fff;
    padding: 16px;
    overflow-x: auto;
  }
  .wf-table {
    border-collapse: collapse;
    font-size: 10px;
    color: #374151;
    /* width:auto인 <table>은 블록 요소라 부모 컨테이너 전체 너비로 늘어나면서 auto layout이
       남는 공간을 컬럼마다 비례 배분해버린다(컬럼 수가 적은 복지포인트/개인별지원사항 표에서
       팀명~근속연수 칸이 연차내역보다 훨씬 넓게 보이던 원인). fit-content로 내용 너비만큼만
       차지하게 해서 min-width로 지정한 폭이 실제로 반영되게 한다. */
    width: fit-content;
  }
  .wf-table th, .wf-table td {
    border: 1px solid var(--border);
    padding: 4px 6px;
    text-align: center;
    white-space: nowrap;
  }
  .wf-table th {
    background: #f7f8fa;
    white-space: normal;
    word-break: keep-all;
    max-width: 70px;
  }
  .wf-table input {
    width: 100%;
    min-width: 40px;
    border: 1px solid transparent;
    background: transparent;
    text-align: center;
    font-size: 10px;
    color: #374151;
    padding: 2px;
    box-sizing: border-box;
    font-family: inherit;
  }
  .wf-table td:nth-child(1) input,
  .wf-table td:nth-child(2) input {
    min-width: 92px;
  }
  .wf-table td:nth-child(4) input,
  .wf-table td:nth-child(5) input {
    min-width: 60px;
  }
  .wf-table td:nth-last-child(2) input {
    min-width: 120px;
  }
  .wf-table input:focus {
    border-color: var(--accent);
    background: #fff;
    outline: none;
  }
  td.wf-readonly {
    background: #fafafa;
  }
  .wf-detail-row td {
    background: #fbfbfd;
  }

  /* 연차내역 탭 - 실제 연차관리 엑셀 서식 색상에 맞춤
     헤더행(th) 순서: 1~6 팀명~연차사용내역, 7~9 기준/사용/잔여, 10 10주년 장기근속(5일),
     11~15 예비군민방위~기타휴가, 16 연간합계, 17 비고, 18 삭제버튼
     데이터행(td)은 1~5 팀명~근속 연수까지는 위치가 고정이지만, 그 다음 연차사용내역은
     연이은 날짜가 colspan으로 병합돼 행마다 칸 수가 달라진다 — 그래서 기준/사용/잔여 이후
     컬럼들은 nth-child 위치가 아니라 JS에서 붙여주는 클래스(wf-col-*)로 지정한다. */
  .wf-leave-table th:nth-child(-n+6),
  .wf-leave-table th:nth-child(n+11):nth-child(-n+15) {
    background: #ff99cc;
  }
  .wf-leave-table th:nth-child(n+7):nth-child(-n+9),
  .wf-leave-table th:nth-child(16) {
    background: #d8e4bc;
  }
  .wf-leave-table th:nth-child(10) {
    background: #d9d9d9;
  }
  /* 복지포인트 내역의 팀명~근속 연수 칸을 연차내역과 같은 색/폭/폰트로 맞출 때 쓰는 클래스.
     min-width만으로는 auto table layout이 남는 공간을 컬럼마다 비례 배분해버려서(컬럼 수가
     적은 표일수록 심함) 실제로는 연차내역보다 훨씬 넓게 렌더링되는 문제가 있었다 — 그래서
     연차내역을 제외한 wf-table에는 table-layout:fixed를 걸어둔다. 실제 컬럼 폭은
     renderPointsTable()이 만드는 <colgroup>/<col>로 지정한다 — th에 폭을 걸면 표 맨 위에
     그룹 제목행(예: "개인별복지사항" colspan행) 같은 게 추가되는 순간 "첫 번째 행" 기준이
     깨지므로, colgroup처럼 행 구조와 무관한 방식만 안정적으로 유지된다. 아래 td 폭 지정은
     colgroup과 같은 값으로 맞춰서 이중 안전장치 역할만 한다. */
  th.wf-roster-col {
    background: #ff99cc;
  }
  /* 복지포인트 표의 지급포인트/잔여한도/사용내역 헤더 — 연차내역의 기준/사용/잔여(연차
     지급·사용) 헤더와 같은 초록으로 맞춘다(같은 개념: 지급/잔여/사용 현황). */
  th.wf-points-green {
    background: #d8e4bc;
  }
  th.wf-points-sky {
    background: #cfe8f5;
  }
  /* 팀명~근속연수는 이제 연차내역 기준 읽기전용 칸(rosterReadonlyCell, <input> 없음)이라
     td 자체에 폰트 크기를 지정한다 — 연차내역(.wf-leave-table, 11px)과 동일하게 맞춘다. */
  .wf-table td.wf-roster-col {
    font-size: 10px;
  }
  /* 성명/직급/입사일/근속연수 칸은 연한 회색으로 — 팀명(분홍)과 구분되는 재직자 정보
     블록으로 보이게 한다. 연차내역/복지포인트 둘 다 같은 클래스를 쓰므로 함께 적용된다. */
  .wf-table td.wf-roster-col:not(.wf-roster-team) {
    background: #f2f2f2;
  }
  /* 복지포인트의 팀명 칸은 rosterReadonlyCell이 재사용하는 td.wf-readonly의 회색(#fafafa)이
     기본으로 깔리는데, 연차내역의 팀명 칸(편집 가능한 흰 칸)과 색을 맞추려면 흰색으로
     덮어써야 한다. */
  .wf-table td.wf-roster-team {
    background: #fff;
  }
  /* 복지포인트 표의 팀명 병합은 진짜 rowSpan 대신 CSS로만 흉내낸다(위 fakeTeamMerge 주석
     참고) — 이어지는 칸의 위쪽 테두리와 바로 위 칸의 아래쪽 테두리를 둘 다 없애야
     border-collapse에서 경계선이 완전히 사라져 진짜 병합처럼 보인다. */
  .wf-table td.wf-team-merged {
    border-top: none;
  }
  .wf-table td.wf-team-merge-bottom {
    border-bottom: none;
  }
  /* 여러 행이 병합된 그룹의 팀명은 첫 행 칸 안에 절대좌표로 배치한 라벨(JS가 그룹 전체
     높이를 재서 height를 지정)로 그려서, 진짜 rowSpan처럼 그룹 전체의 세로 정중앙에
     보이게 한다 — position:relative인 이 칸(host)이 라벨의 기준점이 된다. */
  .wf-table td.wf-team-merge-host {
    position: relative;
  }
  .wf-team-merge-label {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  /* .wf-table td:nth-child(1)/(2)/(4)/(5) input, td:nth-last-child(2) input에 걸린
     min-width(92px/60px/120px, 위 참고)는 연차내역처럼 컬럼 수가 많아 폭 계산이 안 겹치는
     표를 기준으로 만든 값이라, table-layout:fixed로 폭을 직접 지정한(또는 남는 공간을
     나눠 갖는) 표에서는 셀 너비보다 커져서 글씨가 옆 칸과 겹쳐 보이는 원인이 된다.
     연차내역을 제외한 wf-table의 모든 입력칸은 min-width를 없애서 항상 셀 폭(width:100%)에
     맞춰지도록 한다. */
  .wf-table:not(.wf-leave-table) td input {
    min-width: 0;
  }
  .wf-table:not(.wf-leave-table) {
    table-layout: fixed;
    /* 이제 colgroup이 12칸 전부(팀명~부모님검진) 폭을 지정하므로, 표 자체는 그 합계만큼만
       차지하면 된다(위 .wf-table의 fit-content를 그대로 따름) — width:auto로 두면 남는
       공간을 채우려고 지정한 폭을 다시 비례로 늘려버리는 브라우저도 있어 위험하다. */
    width: fit-content;
  }
  .wf-table:not(.wf-leave-table) th,
  .wf-table:not(.wf-leave-table) td {
    box-sizing: border-box;
  }
  .wf-table:not(.wf-leave-table) td.wf-roster-team {
    width: 75px;
  }
  .wf-table:not(.wf-leave-table) td.wf-roster-name {
    width: 75px;
  }
  .wf-table:not(.wf-leave-table) td.wf-roster-position {
    width: 53px;
  }
  .wf-table:not(.wf-leave-table) td.wf-roster-hire {
    width: 69px;
  }
  .wf-table:not(.wf-leave-table) td.wf-roster-tenure {
    width: 69px;
  }
  /* 연차사용내역은 연이은 날짜가 colspan으로 병합돼 행마다 칸 수가 달라지므로, 데이터 칸
     색상은 nth-child 대신 JS에서 붙여주는 클래스(wf-col-*, wf-usage-cell) 기준으로 지정한다. */
  .wf-leave-table td.wf-col-used {
    background: #ffffcc;
  }
  .wf-leave-table td.wf-col-remaining {
    background: #ffcccc;
  }
  .wf-leave-table td.wf-col-longService {
    background: #d9d9d9;
  }
  .wf-leave-table td.wf-col-yeartotal {
    background: #ffffcc;
  }
  .wf-leave-table td.wf-usage-cell {
    background: #fffce6;
  }
  /* 퇴사자 행 — 컬럼별 색상보다 우선해서 전체를 회색으로 덮는다. 연차내역뿐 아니라 복지포인트/
     개인별지원사항도 이름으로 대조해서 같은 클래스를 붙이므로 wf-table 전체에 적용한다. */
  .wf-table tr.wf-resigned-row td {
    background: #d9d9d9 !important;
    color: var(--text-dim);
  }
  .wf-leave-table,
  .wf-leave-table input {
    font-size: 10px;
  }
  .wf-leave-table th,
  .wf-leave-table td {
    padding: 2px 3px;
    text-align: center;
    vertical-align: middle;
  }
  .wf-leave-table th {
    max-width: none;
  }
  .wf-leave-table input {
    text-align: center;
  }
  .wf-leave-table input {
    min-width: 30px;
  }
  .wf-leave-table td:nth-child(1) input {
    min-width: 68px;
  }
  .wf-leave-table td:nth-child(2) input {
    min-width: 46px;
  }
  .wf-leave-table td:nth-child(3) input {
    min-width: 36px;
  }
  .wf-leave-table td:nth-child(4) input {
    min-width: 62px;
  }
  .wf-leave-table td:nth-child(5) input {
    min-width: 26px;
  }
  .wf-leave-table td:nth-last-child(2) input {
    min-width: 80px;
  }
  .wf-leave-table td.wf-usage-cell input {
    min-width: 28px;
    width: 100%;
    padding: 2px 1px;
  }
  .wf-mini-table {
    border-collapse: collapse;
    font-size: 10px;
    margin: 6px auto;
    max-width: 100%;
  }
  .wf-mini-table th, .wf-mini-table td {
    border: 1px solid var(--border);
    padding: 3px 6px;
  }
  .wf-link-btn {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    font-size: 12px;
    padding: 0;
  }
  .wf-del-btn {
    background: #fee2e2;
    color: #b91c1c;
    border: none;
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 11px;
  }
  .wf-resign-btn {
    background: #fef3c7;
    color: #92400e;
    border: none;
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    font-size: 11px;
  }
  .wf-resign-btn.wf-resign-btn-restore {
    background: #dbeafe;
    color: #1e40af;
  }
  .wf-add-btn {
    margin-top: 12px;
  }
  .wf-add-btn,
  #wf-hiworks-sync-btn,
  #wf-download-btn {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
  }

  /* 대리점 수수료 정산 — 비고(유일한 multiline 필드)는 이제 상세 그리드(.ac-detail-field)
     안에만 있으므로, 아래 그리드용 스타일이 textarea까지 함께 지정한다. */
  .ac-table tr.ac-row-carry td {
    background: #fff8e6;
  }
  .ac-table tr.ac-row-total td {
    background: var(--accent-bg);
  }
  .ac-table tr.ac-row-blank td {
    background: #fafafa;
  }
  /* 종료 체크된 행 — carry/total/blank보다 우선(뒤에 선언) 회색 처리 */
  .ac-table tr.ac-row-closed td {
    background: #e5e7eb;
    color: #6b7280;
  }
  /* 미납("미납/금액")은 빨간 폰트, 미납금을 늦게 납부한 경우("6.30/금액")는 노란 셀로 구분 */
  .ac-table input.ac-unpaid {
    color: #dc2626;
    font-weight: 600;
  }
  .ac-table input.ac-late-paid {
    background: #fef9c3;
  }
  .ac-close-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    white-space: nowrap;
    cursor: pointer;
  }
  /* 대리점명 세로 병합 칸(블록 전체에 하나) — 항상 흰색, 입력칸 하나만 표시(옆에 있던 "+ 계약"
     버튼은 2026-08-05 삭제됨).
     이전에 display:flex를 줬더니 table-layout:fixed인 표에서 이 rowSpan 칸의 컬럼 폭이 고정
     레이아웃을 벗어나면서, 이 칸에 가려진 2번째 계약 줄부터 왼쪽으로 밀려 보이는 버그가 있었음
     (2026-08-04 이월금/총지급금액 칸에서 났던 것과 같은 원인 — 2026-08-05 대리점 칸에서도 발견해
     같은 방식으로 고침). flex 제거하고 input을 block으로 배치. */
  .ac-table td.ac-dealer-merged {
    vertical-align: middle;
    background: #fff !important;
    padding: 6px 4px;
  }
  .ac-table td.ac-dealer-merged input {
    display: block;
    width: 100%;
    box-sizing: border-box;
  }
  /* 총지급금액 아랫줄(빈 행)의 병합 칸 — 입력칸 없이 "비고" 라벨 텍스트만 표시(가운데 정렬) */
  .ac-table td.ac-blank-note-td {
    text-align: center;
    color: #9ca3af;
    font-size: 11px;
  }
  /* 이월금/총지급금액 행의 병합 칸(customerNo 값이 3칸에 걸쳐 텍스트로 표시됨) — 가운데 정렬.
     예전에 display:flex를 줬더니 td가 테이블 레이아웃(table-layout:fixed)을 벗어나면서
     긴 텍스트("총지급금액(실제지급달)계산서")가 표 왼쪽 바깥으로 밀려 나가는 버그가 있었음
     (2026-08-04 실사용 스크린샷에서 발견) — flex 제거하고 일반 텍스트 정렬로 되돌림. */
  .ac-table td.ac-carrytotal-label-td {
    text-align: center;
  }
  .ac-add-note-btn {
    font-size: 10px;
    white-space: nowrap;
    color: #b45309;
    margin-left: 6px;
  }
  .ac-move-cell {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .ac-move-btn {
    font-size: 9px;
    line-height: 1;
    padding: 1px 4px;
  }
  .ac-move-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .ac-toggle-btn {
    white-space: nowrap;
  }
  .ac-detail-row td {
    text-align: left;
    background: #fbfbfd;
  }
  .ac-detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px 16px;
    padding: 10px 8px;
  }
  .ac-detail-field {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ac-detail-field-wide {
    grid-column: 1 / -1;
  }
  .ac-detail-label {
    font-size: 10px;
    color: #6b7280;
  }
  .ac-detail-field input,
  .ac-detail-field textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11px;
    font-family: inherit;
  }
  .ac-detail-field textarea {
    resize: vertical;
  }
  .ac-detail-field input:focus,
  .ac-detail-field textarea:focus {
    border-color: var(--accent);
    outline: none;
  }
</style>
</head>

  };

  // 섹션이 렌더된 뒤 추가 초기화가 필요한 경우 여기에 등록
  const sectionInit = {
    mail: (root) => window.HilineMailInboxTool.init(root),
    "tax-invoice": (root) => window.HilineTaxInvoiceTool.init(root),
    "tax-summary-compare": (root) => window.HilineTaxSummaryCompareTool.init(root),
    welfare: (root) => window.HilineWelfareTool.init(root),
    "agency-commission": (root) => window.HilineAgencyCommissionTool.init(root),
    "giro-draft": (root) => window.HilineGiroDraftTool.init(root),
    // PDF 편집기는 "나누기"와 "합치기"를 탭으로 한 화면에 담는다.
    // 두 기능은 각각 다른 도구 파일이고 엘리먼트 id도 겹치지 않아 같은 root에 나란히 초기화한다.
    "pdf-editor": (root) => {
      window.HilinePdfEditorTool.init(root);
      window.HilinePdfMergeTool.init(root);
      const tabs = root.querySelectorAll(".pdf-tab");
      tabs.forEach(tab => {
        tab.addEventListener("click", () => {
          tabs.forEach(t => t.classList.toggle("active", t === tab));
          root.querySelectorAll(".pdf-pane").forEach(pane => {
            pane.style.display = pane.id === tab.dataset.pane ? "" : "none";
          });
        });
      });
    },
    "required-docs": (root) => window.HilineRequiredDocsTool.init(root),
  };

  const menuListEl = document.getElementById("menu-list");
  const contentEl = document.getElementById("content");

  // 좌측 메뉴 접기/펼치기 — 화면을 넓게 쓰고 싶을 때 토글, 선택 상태는 localStorage에 저장해
  // 다음에 열 때도 그대로 유지된다.
  const sidebarEl = document.getElementById("sidebar");
  const sidebarToggleBtn = document.getElementById("sidebar-toggle");
  const SIDEBAR_COLLAPSED_KEY = "hiline_sidebar_collapsed";
  function applySidebarState(collapsed) {
    sidebarEl.classList.toggle("collapsed", collapsed);
    sidebarToggleBtn.textContent = collapsed ? "›" : "‹";
    sidebarToggleBtn.title = collapsed ? "메뉴 펼치기" : "메뉴 접기";
  }
  applySidebarState(localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "1");
  sidebarToggleBtn.addEventListener("click", () => {
    const collapsed = !sidebarEl.classList.contains("collapsed");
    localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed ? "1" : "0");
    applySidebarState(collapsed);
  });

  // 표가 넓은 섹션은 main의 900px 폭 제한을 풀어 화면을 최대한 활용한다
  const wideSections = ["welfare", "agency-commission", "tax-summary-compare"];

  function render(id) {
    contentEl.innerHTML = sections[id] ? sections[id]() : sections.home();
    contentEl.classList.toggle("wide-content", wideSections.includes(id));
    document.querySelectorAll("#menu-list li").forEach(li => {
      li.classList.toggle("active", li.dataset.id === id);
    });
    if (sectionInit[id]) sectionInit[id](contentEl);
  }

  // 메뉴 순서는 사용자가 끌어서 바꿀 수 있고, 바꾼 순서는 localStorage에 저장해 다음에도 유지된다.
  const MENU_ORDER_KEY = "hiline_menu_order";

  // 저장된 순서를 현재 메뉴 목록에 입힌다.
  // 나중에 메뉴가 추가돼도(저장된 순서엔 없는 id) 사라지지 않고 뒤에 붙도록 하고,
  // 저장된 순서에만 있고 지금은 없는 id는 조용히 버린다.
  function applySavedOrder(items, savedIds) {
    if (!Array.isArray(savedIds) || !savedIds.length) return items.slice();
    const byId = new Map(items.map(it => [it.id, it]));
    const ordered = [];
    savedIds.forEach(id => {
      const item = byId.get(id);
      if (item) { ordered.push(item); byId.delete(id); }
    });
    return ordered.concat(items.filter(it => byId.has(it.id)));
  }

  function loadMenuOrder() {
    try {
      return JSON.parse(localStorage.getItem(MENU_ORDER_KEY) || "null");
    } catch (err) {
      return null;
    }
  }

  let orderedMenu = applySavedOrder(menuItems, loadMenuOrder());

  function saveMenuOrder() {
    localStorage.setItem(MENU_ORDER_KEY, JSON.stringify(orderedMenu.map(it => it.id)));
  }

  let dragId = null;

  function renderMenu() {
    menuListEl.innerHTML = "";
    const activeId = document.querySelector("#menu-list li.active")?.dataset.id;

    orderedMenu.forEach(item => {
      const li = document.createElement("li");
      li.className = "menu-item";
      li.dataset.id = item.id;
      li.textContent = item.label;
      li.draggable = true;
      li.title = "끌어서 순서를 바꿀 수 있습니다";
      li.addEventListener("click", () => render(item.id));

      li.addEventListener("dragstart", e => {
        dragId = item.id;
        li.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        // 파이어폭스는 데이터가 없으면 드래그를 시작하지 않는다
        e.dataTransfer.setData("text/plain", item.id);
      });
      li.addEventListener("dragend", () => {
        dragId = null;
        menuListEl.querySelectorAll("li").forEach(el => el.classList.remove("dragging", "drop-before", "drop-after"));
      });
      li.addEventListener("dragover", e => {
        if (!dragId || dragId === item.id) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        // 칸의 위쪽 절반이면 앞에, 아래쪽 절반이면 뒤에 놓는다
        const rect = li.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        li.classList.toggle("drop-before", !after);
        li.classList.toggle("drop-after", after);
      });
      li.addEventListener("dragleave", () => li.classList.remove("drop-before", "drop-after"));
      li.addEventListener("drop", e => {
        if (!dragId || dragId === item.id) return;
        e.preventDefault();
        const rect = li.getBoundingClientRect();
        const after = e.clientY > rect.top + rect.height / 2;
        const from = orderedMenu.findIndex(it => it.id === dragId);
        if (from < 0) return;
        const [moved] = orderedMenu.splice(from, 1);
        let to = orderedMenu.findIndex(it => it.id === item.id);
        if (to < 0) to = orderedMenu.length - 1;
        orderedMenu.splice(after ? to + 1 : to, 0, moved);
        saveMenuOrder();
        renderMenu();
      });

      if (item.id === activeId) li.classList.add("active");
      menuListEl.appendChild(li);
    });
  }

  // 순서를 원래대로 되돌리는 버튼 (메뉴 목록 아래)
  document.getElementById("menu-reset-order").addEventListener("click", () => {
    localStorage.removeItem(MENU_ORDER_KEY);
    orderedMenu = menuItems.slice();
    renderMenu();
  });

  renderMenu();
  render("welfare");
</script>

</body>
</html>
